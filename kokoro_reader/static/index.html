<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RockReader</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎧</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="back" class="icon" hidden title="Library">&#8592;</button>
  <h1 id="title">RockReader</h1>
  <span id="status" class="muted"></span>
</header>

<main id="library">
  <form id="upload" class="card">
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="file">File</button>
      <button type="button" class="tab" data-tab="paste">Paste</button>
      <button type="button" class="tab" data-tab="url">URL</button>
    </div>
    <div class="pane" data-pane="file">
      <label class="drop">
        <input type="file" id="file" accept=".pdf,.epub,.txt,.md,.xps,.mobi,.fb2">
        <span id="drop-label">Drop a PDF, EPUB, TXT or Markdown file here, or click to choose</span>
      </label>
    </div>
    <div class="pane" data-pane="paste" hidden>
      <input type="text" id="paste-title" placeholder="Title (optional)">
      <textarea id="paste-text" rows="8" placeholder="Paste text here"></textarea>
    </div>
    <div class="pane" data-pane="url" hidden>
      <input type="url" id="url" placeholder="https://arxiv.org/abs/… or any article link">
      <p class="muted hint">PDF and EPUB links download directly. Web pages get their article text extracted. Pages behind a login need the browser extension.</p>
    </div>
    <div class="row">
      <label>Voice <select id="upload-voice"></select></label>
      <button type="submit" id="upload-btn" disabled>Add to library</button>
    </div>
  </form>
  <ul id="docs" class="list"></ul>
</main>

<main id="reader" hidden>
  <article id="text"></article>
</main>

<footer id="player" hidden>
  <div id="genbar"><div id="genfill"></div></div>
  <div class="controls">
    <button class="icon" id="prev" title="Previous paragraph">&#9198;</button>
    <button class="icon" id="rew" title="Back 15 s">&#8634;</button>
    <button class="icon big" id="play" title="Play / pause">&#9654;</button>
    <button class="icon" id="ffw" title="Forward 15 s">&#8635;</button>
    <button class="icon" id="next" title="Next paragraph">&#9197;</button>
  </div>
  <div class="row small">
    <span id="counter"></span>
    <label>Speed <select id="speed">
      <option>0.8</option><option selected>1</option><option>1.1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option>
    </select></label>
    <label>Voice <select id="voice"></select></label>
    <a id="export" href="#" title="Download the whole document as one MP3 (once fully generated)">Export MP3</a>
  </div>
  <audio id="audio" preload="auto"></audio>
</footer>

<script src="app.js"></script>
</body>
</html>
