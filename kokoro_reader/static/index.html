<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RockReader</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎧</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="back" class="icon" hidden title="Library" aria-label="Back to library">&#8592;</button>
  <h1 id="title">RockReader</h1>
  <span id="status" class="muted"></span>
  <button id="keep" class="primary small-btn" hidden>Save to library</button>
</header>

<main id="library">
  <form id="upload" class="card">
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="file">File</button>
      <button type="button" class="tab" data-tab="paste">Paste</button>
      <button type="button" class="tab" data-tab="url">URL</button>
    </div>
    <div class="pane" data-pane="file">
      <label class="drop">
        <input type="file" id="file" accept=".pdf,.epub,.txt,.md,.xps,.mobi,.fb2">
        <span id="drop-label">Drop a PDF, EPUB, TXT or Markdown file here, or click to choose</span>
      </label>
    </div>
    <div class="pane" data-pane="paste" hidden>
      <input type="text" id="paste-title" placeholder="Title (optional)">
      <textarea id="paste-text" rows="8" placeholder="Paste text here"></textarea>
      <p class="muted hint" id="paste-count"></p>
    </div>
    <div class="pane" data-pane="url" hidden>
      <input type="url" id="url" placeholder="https://arxiv.org/abs/… or any article link">
      <p class="muted hint">PDF and EPUB links download directly. Web pages get their article text extracted. Pages behind a login need the browser extension.</p>
    </div>
    <div class="row">
      <input type="hidden" id="upload-voice" value="af_heart">
      <button type="button" class="voice-btn" data-for="upload-voice">Voice: <b>Heart</b></button>
      <span class="spacer"></span>
      <button type="button" id="listen-btn" class="primary" hidden disabled>Listen now</button>
      <button type="submit" id="upload-btn" disabled>Add to library</button>
    </div>
  </form>
  <ul id="docs" class="list"></ul>
</main>

<main id="reader" hidden>
  <article id="text"></article>
</main>

<footer id="player" hidden>
  <div id="track" title="Click to jump" aria-label="Document position">
    <div id="track-segments"></div>
    <div id="track-pos"></div>
  </div>
  <div class="deck">
    <div class="readout">
      <span id="counter">Paragraph 1 of 1</span>
      <span id="clock">0:00 / 0:00</span>
      <span id="remaining"></span>
    </div>
    <div class="controls">
      <button class="icon" id="prev" title="Previous paragraph (↑)" aria-label="Previous paragraph">&#9198;</button>
      <button class="icon" id="rew" title="Back 15 seconds (←)" aria-label="Back 15 seconds">15</button>
      <button class="icon big" id="play" title="Play / pause (space)" aria-label="Play"><span>&#9654;</span></button>
      <button class="icon" id="ffw" title="Forward 15 seconds (→)" aria-label="Forward 15 seconds">15</button>
      <button class="icon" id="next" title="Next paragraph (↓)" aria-label="Next paragraph">&#9197;</button>
    </div>
    <div class="tools">
      <button id="speed" title="Playback speed" aria-haspopup="true">1×</button>
      <input type="hidden" id="voice" value="af_heart">
      <button class="voice-btn" data-for="voice" title="Change voice"><b>Heart</b></button>
      <a id="export" href="#" title="Download the whole document as one Opus file">Export</a>
    </div>
  </div>
  <audio id="audio" preload="auto"></audio>
</footer>

<div id="voice-pop" class="pop" hidden>
  <div class="pop-head"><span>Choose a voice</span><button class="icon small" id="voice-close" aria-label="Close">&#10005;</button></div>
  <div id="voice-list"></div>
</div>
<div id="speed-pop" class="pop speed-pop" hidden>
  <div class="pop-head"><span>Speed</span><span id="speed-value">1×</span></div>
  <input type="range" id="speed-range" min="0.5" max="3" step="0.05" value="1" aria-label="Playback speed">
  <div class="chips" id="speed-chips"></div>
  <p class="muted hint">Press [ and ] while listening to step by 0.1.</p>
</div>
<div id="scrim" hidden></div>

<script src="app.js"></script>
</body>
</html>
