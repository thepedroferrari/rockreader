[project]
name = "rockreader"
version = "0.1.0"
description = "Local Kokoro-82M text-to-speech server with streaming audio, for Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio[tts,server]>=0.5.4",
    "misaki[en]>=0.9",
    "spacy>=3.8,<4",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "trafilatura>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kokoro_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
